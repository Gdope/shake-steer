<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="Cocktail placeholder">
  <defs>
    <linearGradient id="c07bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123324"/>
      <stop offset="1" stop-color="#150d1c"/>
    </linearGradient>
    <radialGradient id="c07glow" cx="50%" cy="38%" r="62%">
      <stop offset="0" stop-color="#7fd67f" stop-opacity=".45"/>
      <stop offset="1" stop-color="#7fd67f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c07liq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd67f" stop-opacity=".95"/>
      <stop offset="1" stop-color="#7fd67f" stop-opacity=".55"/>
    </linearGradient>
    <!-- keeps the bubbles inside the drink instead of floating past the glass -->
    <clipPath id="c07clip"><path d="M166,206 C162,248 178,254 174,300 C172,332 185,344 200,344 C215,344 228,332 226,300 C222,254 238,248 234,206 Z"/></clipPath>
  </defs>

  <rect width="400" height="500" fill="url(#c07bg)"/>
  <ellipse cx="200" cy="210" rx="200" ry="190" fill="url(#c07glow)"/>

  <!-- soft bokeh -->
  <circle cx="62" cy="92" r="46" fill="#c9a35e" opacity=".07"/>
  <circle cx="338" cy="404" r="62" fill="#7fd67f" opacity=".09"/>
  <circle cx="326" cy="86" r="18" fill="#c9a35e" opacity=".12"/>

  <!-- drink -->
  <g>
    <path d="M166,206 C162,248 178,254 174,300 C172,332 185,344 200,344 C215,344 228,332 226,300 C222,254 238,248 234,206 Z" fill="url(#c07liq)"/>
    <g clip-path="url(#c07clip)"><circle cx="200" cy="283" r="2" fill="#f0e2c4" opacity=".35"/><circle cx="187" cy="378" r="5" fill="#f0e2c4" opacity=".35"/><circle cx="174" cy="301" r="4" fill="#f0e2c4" opacity=".35"/><circle cx="173" cy="348" r="3" fill="#f0e2c4" opacity=".35"/><circle cx="180" cy="327" r="2" fill="#f0e2c4" opacity=".35"/><circle cx="219" cy="342" r="5" fill="#f0e2c4" opacity=".35"/><circle cx="222" cy="253" r="4" fill="#f0e2c4" opacity=".35"/><circle cx="209" cy="284" r="3" fill="#f0e2c4" opacity=".35"/><circle cx="184" cy="355" r="2" fill="#f0e2c4" opacity=".35"/><circle cx="199" cy="278" r="5" fill="#f0e2c4" opacity=".35"/><circle cx="218" cy="337" r="4" fill="#f0e2c4" opacity=".35"/><circle cx="213" cy="304" r="3" fill="#f0e2c4" opacity=".35"/><circle cx="192" cy="303" r="2" fill="#f0e2c4" opacity=".35"/><circle cx="187" cy="250" r="5" fill="#f0e2c4" opacity=".35"/></g>
    <g fill="none" stroke="#c9a35e" stroke-width="2.4" stroke-linejoin="round" opacity=".92">
      <path d="M158,146 C147,226 176,248 172,302 C170,336 184,352 200,352 C216,352 230,336 228,302 C224,248 253,226 242,146 Z M196,352 L196,404 M204,352 L204,404 M154,404 a46,9 0 1,0 92,0 a46,9 0 1,0 -92,0 Z"/>
    </g>
    <ellipse cx="224" cy="166" rx="13" ry="8" fill="#8fd694" opacity=".8" transform="rotate(-35 224 166)"/><ellipse cx="250" cy="162" rx="13" ry="8" fill="#8fd694" opacity=".8" transform="rotate(30 250 162)"/><ellipse cx="238" cy="150" rx="13" ry="8" fill="#8fd694" opacity=".8" transform="rotate(0 238 150)"/><path d="M238,188 L238,156" stroke="#8fd694" stroke-width="2" opacity=".8"/>
  </g>

  <!-- reflection on the table -->
  <ellipse cx="200" cy="428" rx="120" ry="12" fill="#c9a35e" opacity=".08"/>

