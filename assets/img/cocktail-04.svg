<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="Cocktail placeholder">
  <defs>
    <linearGradient id="c04bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1240"/>
      <stop offset="1" stop-color="#150d1c"/>
    </linearGradient>
    <radialGradient id="c04glow" cx="50%" cy="38%" r="62%">
      <stop offset="0" stop-color="#6fd0c8" stop-opacity=".45"/>
      <stop offset="1" stop-color="#6fd0c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c04liq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fd0c8" stop-opacity=".95"/>
      <stop offset="1" stop-color="#6fd0c8" stop-opacity=".55"/>
    </linearGradient>
    <!-- keeps the bubbles inside the drink instead of floating past the glass -->
    <clipPath id="c04clip"><path d="M147,282 L253,282 L246,396 L154,396 Z"/></clipPath>
  </defs>

  <rect width="400" height="500" fill="url(#c04bg)"/>
  <ellipse cx="200" cy="210" rx="200" ry="190" fill="url(#c04glow)"/>

  <!-- soft bokeh -->
  <circle cx="62" cy="92" r="46" fill="#c9a35e" opacity=".07"/>
  <circle cx="338" cy="404" r="62" fill="#6fd0c8" opacity=".09"/>
  <circle cx="326" cy="86" r="18" fill="#c9a35e" opacity=".12"/>

  <!-- drink -->
  <g>
    <path d="M147,282 L253,282 L246,396 L154,396 Z" fill="url(#c04liq)"/>
    <g clip-path="url(#c04clip)"><circle cx="199" cy="258" r="5" fill="#f0e2c4" opacity=".35"/><circle cx="190" cy="249" r="4" fill="#f0e2c4" opacity=".35"/><circle cx="173" cy="348" r="3" fill="#f0e2c4" opacity=".35"/><circle cx="172" cy="243" r="2" fill="#f0e2c4" opacity=".35"/><circle cx="211" cy="366" r="5" fill="#f0e2c4" opacity=".35"/><circle cx="178" cy="269" r="4" fill="#f0e2c4" opacity=".35"/><circle cx="205" cy="268" r="3" fill="#f0e2c4" opacity=".35"/><circle cx="208" cy="339" r="2" fill="#f0e2c4" opacity=".35"/><circle cx="207" cy="322" r="5" fill="#f0e2c4" opacity=".35"/><circle cx="202" cy="257" r="4" fill="#f0e2c4" opacity=".35"/><circle cx="205" cy="340" r="3" fill="#f0e2c4" opacity=".35"/><circle cx="224" cy="355" r="2" fill="#f0e2c4" opacity=".35"/><circle cx="227" cy="374" r="5" fill="#f0e2c4" opacity=".35"/><circle cx="226" cy="265" r="4" fill="#f0e2c4" opacity=".35"/></g>
    <g fill="none" stroke="#c9a35e" stroke-width="2.4" stroke-linejoin="round" opacity=".92">
      <path d="M140,236 L260,236 L252,404 L148,404 Z"/>
    </g>
    <path d="M244,178 c18,-6 26,8 14,20 c-12,12 -30,4 -26,-12" fill="none" stroke="#f0e2c4" stroke-width="5" stroke-linecap="round" opacity=".85"/>
  </g>

  <!-- reflection on the table -->
  <ellipse cx="200" cy="428" rx="120" ry="12" fill="#c9a35e" opacity=".08"/>

  <!-- frame + placeholder note -->
  <rect x="14" y="14" width="372" height="472" fill="none" stroke="#c9a35e" stroke-width="1" opacity=".25"/>
  <text x="200" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="11"
        letter-spacing="4" fill="#c9a35e" opacity=".55">PLACEHOLDER PHOTO</text>
</svg>
