<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="Cocktail placeholder">
  <defs>
    <linearGradient id="c06bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#251142"/>
      <stop offset="1" stop-color="#150d1c"/>
    </linearGradient>
    <radialGradient id="c06glow" cx="50%" cy="38%" r="62%">
      <stop offset="0" stop-color="#b47ae8" stop-opacity=".45"/>
      <stop offset="1" stop-color="#b47ae8" stop-opacity="0"/>
