<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="Cocktail placeholder">
  <defs>
    <linearGradient id="c09bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1a3a"/>
      <stop offset="1" stop-color="#150d1c"/>
    </linearGradient>
    <radialGradient id="c09glow" cx="50%" cy="38%" r="62%">
      <stop offset="0" stop-color="#5b8dee" stop-opacity=".45"/>
      <stop offset="1" stop-color="#5b8dee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c09liq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b8dee" stop-opacity=".95"/>
      <stop offset="1" stop-color="#5b8dee" stop-opacity=".55"/>
    </linearGradient>
    <!-- keeps the bubbles inside the drink instead of floating past the glass -->
    <clipPath id="c09clip"><path d="M161,240 L239,240 L230,398 L170,398 Z"/></clipPath>
  </defs>

  <rect width="400" height="500" fill="url(#c09bg)"/>
  <ellipse cx="200" cy="210" rx="200" ry="190" fill="url(#c09glow)"/>

  <!-- soft bokeh -->
  <circle cx="62" cy="92" r="46" fill="#c9a35e" opacity=".07"/>
  <circle cx="338" cy="404" r="62" fill="#5b8dee" opacity=".09"/>
  <circle cx="326" cy="86" r="18" fill="#c9a35e" opacity=".12"/>

  <!-- drink -->
  <g>
    <path d="M161,240 L239,240 L230,398 L170,398 Z" fill="url(#c09liq)"/>
    <g clip-path="url(#c09clip)"><circle cx="226" cy="249" r="4" fill="#f0e2c4" opacity=".35"/><circle cx="225" cy="332" r="3" fill="#f0e2c4" opacity=".35"/><circle cx="172" cy="363" r="2" fill="#f0e2c4" opacity=".35"/><circle cx="179" cy="270" r="5" fill="#f0e2c4" opacity=".35"/><circle cx="182" cy="305" r="4" fill="#f0e2c4" opacity=".35"/><circle cx="229" cy="344" r="3" fill="#f0e2c4" opacity=".35"/><circle cx="216" cy="375" r="2" fill="#f0e2c4" opacity=".35"/><circle cx="187" cy="286" r="5" fill="#f0e2c4" opacity=".35"/><circle cx="174" cy="365" r="4" fill="#f0e2c4" opacity=".35"/><circle cx="185" cy="288" r="3" fill="#f0e2c4" opacity=".35"/><circle cx="204" cy="331" r="2" fill="#f0e2c4" opacity=".35"/><circle cx="223" cy="282" r="5" fill="#f0e2c4" opacity=".35"/><circle cx="186" cy="349" r="4" fill="#f0e2c4" opacity=".35"/><circle cx="201" cy="372" r="3" fill="#f0e2c4" opacity=".35"/></g>
    <g fill="none" stroke="#c9a35e" stroke-width="2.4" stroke-linejoin="round" opacity=".92">
      <path d="M156,200 L244,200 L234,406 L166,406 Z"/>
    </g>
    <path d="M244,178 c18,-6 26,8 14,20 c-12,12 -30,4 -26,-12" fill="none" stroke="#f0e2c4" stroke-width="5" stroke-linecap="round" opacity=".85"/>
  </g>

  <!-- reflection on the table -->
  <ellipse cx="200" cy="428" rx="120" ry="12" fill="#c9a35e" opacity=".08"/>

  <!-- frame + placeholder note -->
  <rect x="14" y="14" width="372" height="472" fill="none" stroke="#c9a35e" stroke-width="1" opacity=".25"/>
  <text x="200" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="11"
        letter-spacing="4" fill="#c9a35e" opacity=".55">PLACEHOLDER PHOTO</text>
</svg>
