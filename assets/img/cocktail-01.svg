<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="Cocktail placeholder">
  <defs>
    <linearGradient id="c01bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b1550"/>
      <stop offset="1" stop-color="#150d1c"/>
    </linearGradient>
    <radialGradient id="c01glow" cx="50%" cy="38%" r="62%">
      <stop offset="0" stop-color="#e0563c" stop-opacity=".45"/>
      <stop offset="1" stop-color="#e0563c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c01liq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0563c" stop-opacity=".95"/>
      <stop offset="1" stop-color="#e0563c" stop-opacity=".55"/>
    </linearGradient>
    <!-- keeps the bubbles inside the drink instead of floating past the glass -->
    <clipPath id="c01clip"><path d="M129,210 L271,210 C266,250 238,274 200,274 C162,274 134,250 129,210 Z"/></clipPath>
  </defs>

  <rect width="400" height="500" fill="url(#c01bg)"/>
  <ellipse cx="200" cy="210" rx="200" ry="190" fill="url(#c01glow)"/>

  <!-- soft bokeh -->
  <circle cx="62" cy="92" r="46" fill="#c9a35e" opacity=".07"/>
  <circle cx="338" cy="404" r="62" fill="#e0563c" opacity=".09"/>
  <circle cx="326" cy="86" r="18" fill="#c9a35e" opacity=".12"/>

  <!-- drink -->
