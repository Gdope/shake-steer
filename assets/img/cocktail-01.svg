    <g clip-path="url(#c01clip)"><circle cx="198" cy="245" r="4" fill="#f0e2c4" opacity=".35"/><circle cx="193" cy="248" r="3" fill="#f0e2c4" opacity=".35"/><circle cx="172" cy="243" r="2" fill="#f0e2c4" opacity=".35"/><circle cx="223" cy="278" r="5" fill="#f0e2c4" opacity=".35"/><circle cx="182" cy="265" r="4" fill="#f0e2c4" opacity=".35"/><circle cx="189" cy="336" r="3" fill="#f0e2c4" opacity=".35"/><circle cx="188" cy="271" r="2" fill="#f0e2c4" opacity=".35"/><circle cx="215" cy="266" r="5" fill="#f0e2c4" opacity=".35"/><circle cx="170" cy="301" r="4" fill="#f0e2c4" opacity=".35"/><circle cx="205" cy="376" r="3" fill="#f0e2c4" opacity=".35"/><circle cx="192" cy="343" r="2" fill="#f0e2c4" opacity=".35"/><circle cx="175" cy="266" r="5" fill="#f0e2c4" opacity=".35"/><circle cx="210" cy="317" r="4" fill="#f0e2c4" opacity=".35"/><circle cx="213" cy="280" r="3" fill="#f0e2c4" opacity=".35"/></g>
    <g fill="none" stroke="#c9a35e" stroke-width="2.4" stroke-linejoin="round" opacity=".92">
