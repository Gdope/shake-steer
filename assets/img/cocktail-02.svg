<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="Cocktail placeholder">
  <defs>
    <linearGradient id="c02bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a0f3d"/>
      <stop offset="1" stop-color="#150d1c"/>
    </linearGradient>
    <radialGradient id="c02glow" cx="50%" cy="38%" r="62%">
      <stop offset="0" stop-color="#f2c14e" stop-opacity=".45"/>
      <stop offset="1" stop-color="#f2c14e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c02liq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c14e" stop-opacity=".95"/>
      <stop offset="1" stop-color="#f2c14e" stop-opacity=".55"/>
    </linearGradient>
    <!-- keeps the bubbles inside the drink instead of floating past the glass -->
    <clipPath id="c02clip"><path d="M124,204 L276,204 L200,297 Z"/></clipPath>
  </defs>

  <rect width="400" height="500" fill="url(#c02bg)"/>
  <ellipse cx="200" cy="210" rx="200" ry="190" fill="url(#c02glow)"/>

  <!-- soft bokeh -->
  <circle cx="62" cy="92" r="46" fill="#c9a35e" opacity=".07"/>
  <circle cx="338" cy="404" r="62" fill="#f2c14e" opacity=".09"/>
  <circle cx="326" cy="86" r="18" fill="#c9a35e" opacity=".12"/>

  <!-- drink -->
  <g>
    <path d="M124,204 L276,204 L200,297 Z" fill="url(#c02liq)"/>
    <g clip-path="url(#c02clip)"><circle cx="181" cy="292" r="3" fill="#f0e2c4" opacity=".35"/><circle cx="212" cy="295" r="2" fill="#f0e2c4" opacity=".35"/><circle cx="227" cy="274" r="5" fill="#f0e2c4" opacity=".35"/><circle cx="226" cy="309" r="4" fill="#f0e2c4" opacity=".35"/><circle cx="209" cy="260" r="3" fill="#f0e2c4" opacity=".35"/><circle cx="228" cy="267" r="2" fill="#f0e2c4" opacity=".35"/><circle cx="211" cy="274" r="5" fill="#f0e2c4" opacity=".35"/><circle cx="170" cy="337" r="4" fill="#f0e2c4" opacity=".35"/><circle cx="225" cy="300" r="3" fill="#f0e2c4" opacity=".35"/><circle cx="224" cy="247" r="2" fill="#f0e2c4" opacity=".35"/><circle cx="219" cy="346" r="5" fill="#f0e2c4" opacity=".35"/><circle cx="214" cy="249" r="4" fill="#f0e2c4" opacity=".35"/><circle cx="173" cy="340" r="3" fill="#f0e2c4" opacity=".35"/><circle cx="220" cy="283" r="2" fill="#f0e2c4" opacity=".35"/></g>
    <g fill="none" stroke="#c9a35e" stroke-width="2.4" stroke-linejoin="round" opacity=".92">
      <path d="M104,186 L296,186 L200,304 Z M196,304 L196,400 M204,304 L204,400 M148,400 a52,9 0 1,0 104,0 a52,9 0 1,0 -104,0 Z"/>
    </g>
    <ellipse cx="224" cy="166" rx="13" ry="8" fill="#8fd694" opacity=".8" transform="rotate(-35 224 166)"/><ellipse cx="250" cy="162" rx="13" ry="8" fill="#8fd694" opacity=".8" transform="rotate(30 250 162)"/><ellipse cx="238" cy="150" rx="13" ry="8" fill="#8fd694" opacity=".8" transform="rotate(0 238 150)"/><path d="M238,188 L238,156" stroke="#8fd694" stroke-width="2" opacity=".8"/>
  </g>

  <!-- reflection on the table -->
  <ellipse cx="200" cy="428" rx="120" ry="12" fill="#c9a35e" opacity=".08"/>

  <!-- frame + placeholder note -->
  <rect x="14" y="14" width="372" height="472" fill="none" stroke="#c9a35e" stroke-width="1" opacity=".25"/>
  <text x="200" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="11"
        letter-spacing="4" fill="#c9a35e" opacity=".55">PLACEHOLDER PHOTO</text>
</svg>
