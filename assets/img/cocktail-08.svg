<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="Cocktail placeholder">
  <defs>
    <linearGradient id="c08bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#40200c"/>
      <stop offset="1" stop-color="#150d1c"/>
    </linearGradient>
    <radialGradient id="c08glow" cx="50%" cy="38%" r="62%">
      <stop offset="0" stop-color="#d98a3a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#d98a3a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c08liq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d98a3a" stop-opacity=".95"/>
      <stop offset="1" stop-color="#d98a3a" stop-opacity=".55"/>
    </linearGradient>
    <!-- keeps the bubbles inside the drink instead of floating past the glass -->
    <clipPath id="c08clip"><path d="M160,236 L240,236 L233,396 L167,396 Z"/></clipPath>
  </defs>

  <rect width="400" height="500" fill="url(#c08bg)"/>
  <ellipse cx="200" cy="210" rx="200" ry="190" fill="url(#c08glow)"/>

  <!-- soft bokeh -->
  <circle cx="62" cy="92" r="46" fill="#c9a35e" opacity=".07"/>
  <circle cx="338" cy="404" r="62" fill="#d98a3a" opacity=".09"/>
  <circle cx="326" cy="86" r="18" fill="#c9a35e" opacity=".12"/>

  <!-- drink -->
  <g>
    <path d="M160,236 L240,236 L233,396 L167,396 Z" fill="url(#c08liq)"/>
    <g clip-path="url(#c08clip)"><circle cx="183" cy="330" r="5" fill="#f0e2c4" opacity=".35"/><circle cx="206" cy="285" r="4" fill="#f0e2c4" opacity=".35"/><circle cx="177" cy="332" r="3" fill="#f0e2c4" opacity=".35"/><circle cx="176" cy="379" r="2" fill="#f0e2c4" opacity=".35"/><circle cx="215" cy="322" r="5" fill="#f0e2c4" opacity=".35"/><circle cx="190" cy="273" r="4" fill="#f0e2c4" opacity=".35"/><circle cx="193" cy="244" r="3" fill="#f0e2c4" opacity=".35"/><circle cx="172" cy="355" r="2" fill="#f0e2c4" opacity=".35"/><circle cx="179" cy="354" r="5" fill="#f0e2c4" opacity=".35"/><circle cx="226" cy="289" r="4" fill="#f0e2c4" opacity=".35"/><circle cx="185" cy="340" r="3" fill="#f0e2c4" opacity=".35"/><circle cx="184" cy="287" r="2" fill="#f0e2c4" opacity=".35"/><circle cx="223" cy="326" r="5" fill="#f0e2c4" opacity=".35"/><circle cx="194" cy="241" r="4" fill="#f0e2c4" opacity=".35"/></g>
    <g fill="none" stroke="#c9a35e" stroke-width="2.4" stroke-linejoin="round" opacity=".92">
      <path d="M154,188 L246,188 L238,404 L162,404 ZM246,224 C284,228 284,292 246,296"/>
    </g>
    <path d="M252,186 C266,160 278,152 282,142" fill="none" stroke="#c9a35e" stroke-width="2" opacity=".8"/><circle cx="252" cy="186" r="11" fill="#c0243f" opacity=".9"/>
  </g>

  <!-- reflection on the table -->
  <ellipse cx="200" cy="428" rx="120" ry="12" fill="#c9a35e" opacity=".08"/>

  <!-- frame + placeholder note -->
  <rect x="14" y="14" width="372" height="472" fill="none" stroke="#c9a35e" stroke-width="1" opacity=".25"/>
  <text x="200" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="11"
        letter-spacing="4" fill="#c9a35e" opacity=".55">PLACEHOLDER PHOTO</text>
</svg>
