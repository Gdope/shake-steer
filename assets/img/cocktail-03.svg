<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="Cocktail placeholder">
  <defs>
    <linearGradient id="c03bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a1030"/>
      <stop offset="1" stop-color="#150d1c"/>
    </linearGradient>
    <radialGradient id="c03glow" cx="50%" cy="38%" r="62%">
      <stop offset="0" stop-color="#e35a7a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#e35a7a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c03liq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e35a7a" stop-opacity=".95"/>
      <stop offset="1" stop-color="#e35a7a" stop-opacity=".55"/>
    </linearGradient>
    <!-- keeps the bubbles inside the drink instead of floating past the glass -->
    <clipPath id="c03clip"><path d="M158,206 L242,206 L237,400 L163,400 Z"/></clipPath>
  </defs>

  <rect width="400" height="500" fill="url(#c03bg)"/>
  <ellipse cx="200" cy="210" rx="200" ry="190" fill="url(#c03glow)"/>

  <!-- soft bokeh -->
  <circle cx="62" cy="92" r="46" fill="#c9a35e" opacity=".07"/>
  <circle cx="338" cy="404" r="62" fill="#e35a7a" opacity=".09"/>
  <circle cx="326" cy="86" r="18" fill="#c9a35e" opacity=".12"/>

  <!-- drink -->
  <g>
    <path d="M158,206 L242,206 L237,400 L163,400 Z" fill="url(#c03liq)"/>
    <g clip-path="url(#c03clip)"><circle cx="224" cy="351" r="2" fill="#f0e2c4" opacity=".35"/><circle cx="171" cy="342" r="5" fill="#f0e2c4" opacity=".35"/><circle cx="170" cy="305" r="4" fill="#f0e2c4" opacity=".35"/><circle cx="229" cy="352" r="3" fill="#f0e2c4" opacity=".35"/><circle cx="184" cy="243" r="2" fill="#f0e2c4" opacity=".35"/><circle cx="199" cy="338" r="5" fill="#f0e2c4" opacity=".35"/><circle cx="174" cy="265" r="4" fill="#f0e2c4" opacity=".35"/><circle cx="193" cy="268" r="3" fill="#f0e2c4" opacity=".35"/><circle cx="220" cy="311" r="2" fill="#f0e2c4" opacity=".35"/><circle cx="183" cy="246" r="5" fill="#f0e2c4" opacity=".35"/><circle cx="178" cy="337" r="4" fill="#f0e2c4" opacity=".35"/><circle cx="193" cy="372" r="3" fill="#f0e2c4" opacity=".35"/><circle cx="204" cy="351" r="2" fill="#f0e2c4" opacity=".35"/><circle cx="227" cy="274" r="5" fill="#f0e2c4" opacity=".35"/></g>
    <g fill="none" stroke="#c9a35e" stroke-width="2.4" stroke-linejoin="round" opacity=".92">
      <path d="M152,150 L248,150 L242,408 L158,408 Z"/>
    </g>
    <path d="M252,186 C266,160 278,152 282,142" fill="none" stroke="#c9a35e" stroke-width="2" opacity=".8"/><circle cx="252" cy="186" r="11" fill="#c0243f" opacity=".9"/>
  </g>

  <!-- reflection on the table -->
  <ellipse cx="200" cy="428" rx="120" ry="12" fill="#c9a35e" opacity=".08"/>

  <!-- frame + placeholder note -->
  <rect x="14" y="14" width="372" height="472" fill="none" stroke="#c9a35e" stroke-width="1" opacity=".25"/>
  <text x="200" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="11"
        letter-spacing="4" fill="#c9a35e" opacity=".55">PLACEHOLDER PHOTO</text>
</svg>
